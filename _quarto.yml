project:
  type: book
  output-dir: _book

book:
  title: "Read Articles with Me"
  subtitle: "Reading, understanding, and simply replicating research papers"
  author: "Julian Kim"
  date: today
  date-format: "YYYY-MM-DD"
  repo-url: https://github.com/julianjhkim/read-articles-with-me
  repo-actions: [edit, issue]
  search: true
  chapters:
    - index.qmd
    - part: "NeuroAI: Brain encoding"
      chapters:
        - neuroai/brain-encoding/2025-duprelatour-vem.qmd
    # To add a paper: copy _templates/paper-template.qmd to
    # <field>/<subfield>/<year>-<author>-<keyword>.qmd and list it under its part.
    # Quarto book sidebars support only one level of parts, so each
    # field/subfield pair gets its own part, e.g. "NeuroAI: Brain decoding".

lang: en

execute:
  freeze: auto   # Code runs locally only; commit _freeze/. CI does not re-run code.
  warning: false
  message: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    fig-align: center
    link-external-newwindow: true
